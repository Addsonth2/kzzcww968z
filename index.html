<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Radar de Edificações</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Conceito: o mapa da região é a própria tela. O vendedor trabalha sobre um radar vivo; cor e forma dizem o que é cada ponto, como placas de sinalização. */
:root{
  color-scheme:dark;
  --tinta:#0C1117; --camada:#151C25; --camada2:#1E2732; --linha:#303C4A; --texto:#F4F7F9; --apagado:#A3B0BD;
  --mul:#EE1638; --mul2:#B30C28; --af:#FFC400; --af2:#E09F00; --pro:#1E6BFF; --pro2:#0F4CC4; --livre:#1FD67F;
  --v1:#FF5CCB; --v2:#27E1F5; --v3:#FF8A1F; --v4:#B6F32A; --v5:#B79CFF;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; --corpo:Archivo,"Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--tinta);color:var(--texto);font:14px/1.45 var(--corpo);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.3px;line-height:1.02;text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.apagado{color:var(--apagado)} .pq{font-size:12.5px}
.linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .esp{flex:1}
.pilha{display:flex;flex-direction:column;gap:10px;min-width:0}

/* mapa e varredura */
#mapa{position:fixed;inset:0;z-index:0;background:#0A0F14}
.leaflet-container{background:#0A0F14;font-family:var(--corpo)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) saturate(.55) brightness(.82) contrast(.95)}
.aglo{display:flex;flex-direction:column;align-items:center;gap:3px;width:150px;cursor:pointer;transition:transform .12s}
.aglo:hover{transform:scale(1.1)}
.aglo b{font:800 17px/1 var(--display);color:#fff;text-shadow:0 1px 5px #000,0 0 2px #000;letter-spacing:.3px;white-space:nowrap}
.aglo .cts{display:flex;border-radius:7px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.6);border:2px solid #fff}
.aglo .cts i{font:900 17px/1 var(--display);font-style:normal;padding:5px 7px;font-variant-numeric:tabular-nums;color:#fff;min-width:27px;text-align:center}
.aglo i.MUL{background:var(--mul)} .aglo i.AF{background:var(--af);color:#111} .aglo i.PRO{background:var(--pro)}
.aglo.peq{width:110px}.aglo.peq .cts i{font-size:15px;padding:3px 6px;min-width:24px}
.mini.prot{outline:2px solid #FFC400}
.alerta-terr.prot{background:rgba(255,196,0,.14);border-color:var(--af)}
.aglo.novo .cts{animation:brilho 1.7s ease-out infinite}
@keyframes brilho{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.leaflet-top{top:70px}.leaflet-bottom{bottom:92px}
.leaflet-control-attribution{background:rgba(12,17,23,.75)!important;color:var(--apagado)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--apagado)!important}
.leaflet-bar a{background:var(--camada)!important;color:var(--texto)!important;border-color:var(--linha)!important}
#varredura{position:fixed;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 0deg,rgba(255,255,255,.13),rgba(255,255,255,0) 55deg,rgba(255,255,255,0) 360deg);animation:gira 7s linear infinite}
#aneis{position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 139px,rgba(255,255,255,.07) 140px 141px)}
@keyframes gira{to{transform:rotate(360deg)}}

/* pontos no mapa: cor + letra + forma */
.ponto{width:24px;height:24px;display:grid;place-items:center;font:800 13px/1 var(--display);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.55);transition:transform .12s;color:#fff;position:relative}
.ponto:hover,.ponto.foco{transform:scale(1.35);z-index:5}
.ponto.MUL{background:var(--mul);border-radius:50%}
.ponto.AF{background:var(--af);color:#111;border-radius:4px;transform:rotate(45deg)}
.ponto.AF span{transform:rotate(-45deg)} .ponto.AF:hover,.ponto.AF.foco{transform:rotate(45deg) scale(1.35)}
.ponto.PRO{background:var(--pro);border-radius:6px}
.ponto.apagar{opacity:.28;border-color:transparent;transform:scale(.6)}
.ponto.AF.apagar{transform:rotate(45deg) scale(.6)}
.ponto.novo::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid currentColor;animation:pulso 1.7s ease-out infinite;pointer-events:none}
.ponto.MUL.novo::after{border-color:var(--mul)} .ponto.AF.novo::after{border-color:var(--af)} .ponto.PRO.novo::after{border-color:#6EA2FF}
@keyframes pulso{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.pt{position:relative;width:24px;height:24px}
.ponto.MA{width:32px;height:32px;background:none;border:0;box-shadow:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.ponto.MA .hx0,.ponto.MA .hx1{position:absolute;display:block;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.ponto.MA .hx0{inset:0;background:#fff}
.ponto.MA .hx1{inset:2.5px;background:linear-gradient(118deg,var(--mul) 0 50%,var(--af) 50% 100%)}
.ponto.MA span{position:absolute;font:800 13px/1 var(--display)}
.ponto.MA .lm{left:7px;top:6px;color:#fff}
.ponto.MA .la{right:8px;bottom:6px;color:#111}
.capa.MA{background:linear-gradient(112deg,var(--mul) 0 72%,var(--af) 72% 100%)}
.tick .faixa.MA{background:linear-gradient(112deg,var(--mul) 0 72%,var(--af) 72% 100%)}
.etapa{border-radius:10px;padding:12px 14px;border:1px solid var(--livre);background:rgba(31,214,127,.12)}
.etapa b{display:block;font:900 26px/1.05 var(--display);color:var(--livre)}
.etapa.indeferido{border-color:#FF6078;background:rgba(238,22,56,.14)}.etapa.indeferido b{color:#FF8DA0}
.etapa.analise{border-color:var(--af);background:rgba(255,196,0,.12)}.etapa.analise b{color:var(--af)}
.pedido{background:var(--af);color:#111;border-radius:10px;padding:12px 14px}
.pedido .t2{font:800 19px var(--display);letter-spacing:.3px}
.pedido .selo{background:#111;color:var(--af)}
.pedido ul{margin:7px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-weight:600}
.tick .pd,.op-pd{font-size:12.5px;color:#FFD84D;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pedido .texto-af{margin:7px 0 4px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.exigs span.feita{background:rgba(31,214,127,.12);color:#7FEBB5;border-color:rgba(31,214,127,.5);text-decoration:line-through}
.mini{position:absolute;right:-9px;top:-8px;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font:800 10.5px/1 var(--display);font-style:normal;color:#0C1117;border:1.5px solid #0C1117;pointer-events:none;z-index:6}
.ponto.nro{background:#fff!important;color:#111!important;border-color:#111;border-radius:50%;transform:none!important}
.ponto.nro span{transform:none!important}
.obra{width:28px;height:28px;display:grid;place-items:center;font:800 14px/1 var(--display);color:#0C1117;border:2px solid #0C1117;clip-path:polygon(50% 0,100% 38%,100% 100%,0 100%,0 38%);transition:transform .12s}
.obra:hover,.obra.foco{transform:scale(1.3)}
.obra span{margin-top:6px}
.obra.vencida{background:#536170!important;color:#fff}

/* moldura */
#app{position:fixed;inset:0;z-index:5;pointer-events:none}
#app>*{pointer-events:auto}
#topo{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,rgba(12,17,23,.95),rgba(12,17,23,0));z-index:12;pointer-events:none}
#topo>*{pointer-events:auto}
.marca{display:flex;align-items:center;gap:10px;font:900 24px/1 var(--display);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.marca small{display:block;font:500 10px/1.2 var(--corpo);letter-spacing:1.6px;color:var(--apagado)}
.etq{display:inline-flex;align-items:center;gap:6px;background:rgba(21,28,37,.92);border:1px solid var(--linha);border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap}
button.etq:hover{border-color:#fff}
.etq .dot{width:8px;height:8px;border-radius:50%;background:var(--livre)}
.etq .dot.alerta{background:var(--af)}
.num-badge{background:#fff;color:#111;border-radius:999px;font-weight:700;font-size:11px;padding:0 6px}

#sinais{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:70px;display:flex;flex-direction:column;gap:8px;width:172px;z-index:10}
.sinal{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:10px 14px 9px;color:#fff;overflow:hidden;transition:transform .12s,opacity .12s,filter .12s;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.sinal:hover{transform:translateX(4px)}
.sinal b{display:block;font:900 40px/.95 var(--display);font-variant-numeric:tabular-nums}
.sinal span{font:800 19px/1 var(--display);letter-spacing:.6px}
.sinal small{position:absolute;right:10px;top:9px;font-size:11px;font-weight:600}
.sinal.MUL{background:repeating-linear-gradient(-45deg,var(--mul) 0 14px,var(--mul2) 14px 28px)}
.sinal.AF{background:var(--af);color:#111}
.sinal.PRO{background:var(--pro)}
.sinal.desligado{background:var(--camada);color:var(--apagado);box-shadow:inset 0 0 0 1px var(--linha)}
.sinal.compacto{background:var(--camada);box-shadow:inset 0 0 0 1px var(--linha);padding:8px 12px}
.sinal.compacto span{font:600 12.5px var(--corpo);letter-spacing:0}
.sinal.compacto.on{box-shadow:inset 0 0 0 2px #fff}

#doca{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(21,28,37,.96);border:1px solid var(--linha);border-radius:16px;padding:5px;z-index:15;box-shadow:0 10px 34px rgba(0,0,0,.5);max-width:calc(100vw - 24px)}
#doca button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:12px;padding:7px 16px;min-width:74px;color:var(--apagado);font-size:12px;font-weight:600;position:relative}
#doca button:hover{color:#fff}
#doca button.on{background:#fff;color:#0C1117}
#doca svg{width:20px;height:20px}
#doca .num-badge{position:absolute;right:8px;top:3px;background:var(--mul);color:#fff}

#ticker{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:30px;overflow:hidden;z-index:8;background:rgba(12,17,23,.72);border-block:1px solid rgba(255,255,255,.08);display:flex;align-items:center}
#ticker .rot{flex:none;background:#fff;color:#111;font:800 14px/30px var(--display);padding:0 12px;letter-spacing:.5px;height:30px;z-index:1}
#ticker .faixa{display:flex;gap:28px;white-space:nowrap;animation:corre 75s linear infinite;padding-left:20px}
#ticker:hover .faixa{animation-play-state:paused}
#ticker button{background:none;border:0;padding:0;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
#ticker button i{font-style:normal;font:800 13px var(--display);padding:1px 6px;border-radius:3px;color:#fff}
#ticker i.MUL{background:var(--mul)} #ticker i.AF{background:var(--af);color:#111} #ticker i.PRO{background:var(--pro)}
@keyframes corre{to{transform:translateX(-50%)}}

/* gaveta do dossiê */
#gaveta{position:absolute;right:0;top:0;bottom:0;width:min(430px,100vw);background:var(--camada);z-index:20;overflow:auto;box-shadow:-14px 0 40px rgba(0,0,0,.5);animation:entra .18s ease-out}
@keyframes entra{from{transform:translateX(24px)}}
.capa{position:relative;padding:18px 20px 16px;color:#fff}
.capa.MUL{background:repeating-linear-gradient(-45deg,var(--mul) 0 18px,var(--mul2) 18px 36px)}
.capa.AF{background:var(--af);color:#111}
.capa.PRO{background:var(--pro)}
.capa.CAMPO{background:var(--cor-dono,#fff);color:#0C1117}
.capa h2{font-size:64px;font-weight:900;line-height:.9}
.capa .sub{font-weight:600;margin-top:4px;font-size:13px}
.fecha{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px;line-height:1}
.miolo{padding:16px 20px 110px;display:flex;flex-direction:column;gap:14px}
.miolo h3{font-size:27px}
.bloco{background:var(--camada2);border-radius:10px;padding:12px 14px}
.bloco .t{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--apagado);font-weight:600;margin-bottom:6px}
.prazo{display:flex;align-items:center;gap:12px}
.prazo b{font:900 44px/1 var(--display);font-variant-numeric:tabular-nums}
.prazo.urg b{color:#FF6078}
.exigs{display:flex;flex-wrap:wrap;gap:6px}
.exigs span{background:rgba(255,196,0,.15);color:#FFD84D;border:1px solid rgba(255,196,0,.5);border-radius:6px;padding:3px 8px;font-size:12.5px}
.alerta-terr{border-radius:10px;padding:12px 14px;background:rgba(255,92,203,.13);border:1px solid var(--v1)}
.alerta-terr b{display:block;font:800 19px var(--display)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha);background:var(--camada2);padding:9px 14px;border-radius:9px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#fff}
.btn.forte{background:#fff;color:#0C1117;border-color:#fff;font:800 19px var(--display);padding:11px 20px;letter-spacing:.3px}
.btn.forte:hover{background:var(--livre);border-color:var(--livre)}
.btn.pq{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.perigo{color:#FF8DA0;border-color:#7A2A38}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--tinta);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--apagado)}
.seg button.on{background:#fff;color:#111}
.inp{width:100%;background:var(--tinta);border:1px solid var(--linha);border-radius:9px;padding:10px 12px;outline:none}
.inp:focus{border-color:#fff}
label.c{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--apagado)}
label.c .inp{color:var(--texto);font-weight:400;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--camada2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--texto)}
.chip.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
.dono{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dono i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:800 12px var(--display);font-style:normal;color:#0C1117}

/* rota */
#rota{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom,0px));background:rgba(21,28,37,.97);border:1px solid #fff;border-radius:12px;padding:8px 12px;z-index:11;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}

/* aviso de oportunidade */
#oport{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));width:340px;border-radius:14px;overflow:hidden;z-index:12;box-shadow:0 14px 40px rgba(0,0,0,.6);background:var(--camada);animation:sobe .25s ease-out}
@keyframes sobe{from{transform:translateY(16px)}}
.op-capa{background:var(--af);color:#111;padding:10px 14px}
.op-capa small{display:block;font:800 13px var(--display);letter-spacing:1px}
.op-capa b{display:block;font:900 38px/1 var(--display);text-transform:uppercase}
.op-c{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.op-c p{margin:0}
.op-lista{border-radius:12px;overflow:hidden;background:var(--camada2)}
.passo{display:inline-flex;align-items:center;background:var(--tinta);border-radius:9px}
.passo button{width:38px;height:38px;border:0;background:transparent;font-size:20px;font-weight:700}
.passo b{min-width:30px;text-align:center;font:900 26px var(--display);font-variant-numeric:tabular-nums}

/* telas cheias */
#painel{position:absolute;inset:0;background:var(--tinta);z-index:6;overflow:auto;padding:70px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.pagina{max-width:1240px;margin:0 auto}
.titulo{font-size:46px;font-weight:900;margin-bottom:4px}

/* fila */
.mesa{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.baralho{position:relative;height:clamp(350px,calc(100vh - 330px),540px);max-width:540px;margin:0 auto;width:100%;touch-action:pan-y}
.carta{position:absolute;inset:0;background:var(--camada);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;user-select:none}
.carta.tras{transform:translateY(14px) scale(.95);filter:brightness(.6)}
.carta.tras2{transform:translateY(26px) scale(.9);filter:brightness(.35)}
.carta.topo{cursor:grab}
.carta .capa{padding:12px 20px 10px}.carta .capa h2{font-size:58px}
.carta .miolo{padding:14px 20px 16px;flex:1;overflow:auto}
.carimbo{position:absolute;top:40px;font:900 58px/1 var(--display);padding:4px 16px;border:6px solid;border-radius:10px;opacity:0;pointer-events:none;background:rgba(12,17,23,.85)}
.carimbo.pega{left:20px;color:var(--livre);transform:rotate(-14deg)}
.carimbo.pula{right:20px;color:#fff;transform:rotate(14deg)}
.controle{display:flex;gap:10px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.lateral{display:flex;flex-direction:column;gap:12px}
.atalho{display:inline-block;border:1px solid var(--linha);border-radius:5px;padding:0 6px;font:500 11px var(--mono)}
.grade-tick{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tick{background:var(--camada);border-radius:12px;overflow:hidden;text-align:left;border:0;padding:0;display:flex;flex-direction:column;transition:transform .12s;width:100%}
.tick:hover{transform:translateY(-3px)}
.tick .faixa{display:flex;align-items:baseline;gap:8px;padding:7px 12px;color:#fff}
.tick .faixa b{font:900 25px/1 var(--display)}
.tick .faixa.MUL{background:repeating-linear-gradient(-45deg,var(--mul) 0 10px,var(--mul2) 10px 20px)}
.tick .faixa.AF{background:var(--af);color:#111}.tick .faixa.PRO{background:var(--pro)}
.tick .corpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.tick .corpo h4{font-size:20px}

/* carteira */
.quadro{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.coluna{background:var(--camada);border-radius:12px;padding:10px;min-height:400px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .1s}
.coluna.sobre{box-shadow:inset 0 0 0 2px #fff}
.coluna>header{display:flex;align-items:baseline;justify-content:space-between;font:800 21px var(--display)}
.coluna.fechado>header{color:var(--livre)}
.cart{background:var(--camada2);border-radius:9px;padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--cor,#fff)}
.cart .nome{font-weight:600;overflow-wrap:anywhere}
.cart select{background:var(--tinta);border:1px solid var(--linha);border-radius:6px;padding:3px 5px;font-size:12px}
.tp{font:800 13px var(--display);letter-spacing:.3px}

/* território */
#terr{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:70px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:360px;background:rgba(21,28,37,.97);border-radius:14px;z-index:10;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.5)}
#terr .cab{padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--linha)}
#terr h2{font-size:30px;font-weight:900}
#terr .rola{overflow:auto;padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:8px}
.veredito{border-radius:10px;padding:10px 12px}
.veredito b{display:block;font:900 30px/1 var(--display)}
.veredito.livre{background:var(--livre);color:#06240F}
.veredito.ocupada{background:var(--mul);color:#fff}
.linha-obra{display:flex;gap:10px;align-items:center;background:var(--camada2);border:0;border-radius:9px;padding:9px 10px;text-align:left;width:100%}
.linha-obra:hover{outline:1px solid #fff}
.linha-obra .av{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:800 16px var(--display);color:#0C1117}
.linha-obra .d{min-width:0;flex:1}
.linha-obra .d b{display:block;overflow-wrap:anywhere}
.selo{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--tinta)}
.selo.bom{color:var(--livre)} .selo.vai{color:var(--af)} .selo.foi{color:var(--apagado)} .selo.ok{background:var(--livre);color:#06240F}
.legenda{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}

/* comando */
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.abas button{border:1px solid var(--linha);background:transparent;border-radius:9px;padding:7px 14px;font:800 18px var(--display);color:var(--apagado)}
.abas button.on{background:#fff;color:#111;border-color:#fff}
.crachas{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.cracha{background:var(--camada);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cracha .top{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--camada2)}
.cracha .fot{width:52px;height:52px;flex:none;border-radius:12px;display:grid;place-items:center;font:900 32px var(--display);color:#0C1117}
.cracha h3{font-size:28px}
.cracha.bloq{opacity:.72}
.cracha .cont{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.trio{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.trio div{background:var(--tinta);border-radius:8px;padding:6px 8px}
.trio b{display:block;font:800 23px/1 var(--display);font-variant-numeric:tabular-nums}
.trio span{font-size:10.5px;color:var(--apagado)}
.barras{display:flex;align-items:flex-end;gap:3px;height:44px;border-bottom:1px solid var(--linha)}
.barras i{flex:1;background:var(--v2);border-radius:3px 3px 0 0;min-height:0;display:block}
.barras i.zero{background:transparent;border-bottom:2px solid var(--linha)}
.tab-wrap{overflow-x:auto;background:var(--camada);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--apagado);padding:9px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--linha)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.aus td{color:var(--apagado)}
.conflito{background:var(--camada);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;border-left:0}
.conflito h3{font-size:24px}
.regra{background:var(--camada);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:center}

/* login */
#login{position:fixed;inset:0;z-index:60;background:rgba(12,17,23,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.cx-login{width:100%;max-width:430px;background:var(--camada);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cx-login .faixas{display:flex;height:12px}
.cx-login .faixas i{flex:1}
.cx-login form{padding:24px;display:flex;flex-direction:column;gap:12px}
.cx-login h1{font-size:58px;font-weight:900;line-height:.92}
.erro{background:rgba(238,22,56,.18);border:1px solid var(--mul);border-radius:9px;padding:9px 12px;font-size:13px}

/* camadas */
#modal{position:fixed;inset:0;background:rgba(5,8,12,.72);display:grid;place-items:center;padding:16px;z-index:70;overflow:auto}
.cx-modal{background:var(--camada);border-radius:14px;padding:20px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.cx-modal.larga{max-width:760px}
.cx-modal h3{font-size:30px}
.fim{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.qr{background:#fff;border-radius:10px;padding:8px;width:216px;margin:0 auto}
.qr svg{display:block;width:200px;height:200px}
#flash{position:fixed;left:0;right:0;top:0;z-index:50;padding:14px 20px;display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left;color:#fff;animation:desce .3s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#flash b{font:900 34px/1 var(--display)}
#flash.MUL{background:repeating-linear-gradient(-45deg,var(--mul) 0 18px,var(--mul2) 18px 36px)} #flash.AF{background:var(--af);color:#111} #flash.PRO{background:var(--pro)}
@keyframes desce{from{transform:translateY(-100%)}}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);background:#fff;color:#111;font-weight:600;padding:10px 16px;border-radius:10px;opacity:0;transition:.18s;pointer-events:none;z-index:80;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#aviso{position:fixed;left:50%;transform:translateX(-50%);top:0;background:#fff;color:#111;font-size:11px;font-weight:600;padding:1px 10px;border-radius:0 0 7px 7px;z-index:90;white-space:nowrap;max-width:calc(100vw - 8px);overflow:hidden;text-overflow:ellipsis}

@media (max-width:820px){
  #sinais{left:12px;right:12px;width:auto;top:58px;flex-direction:row}
  .sinal{padding:6px 8px 5px;flex:1;min-width:0}

  .marca{font-size:18px}.marca small{display:none}
  #topo{padding:14px 12px 8px;gap:6px}
  #topo .so-pc{display:none}
  #doca{left:0;right:0;transform:none;bottom:0;border-radius:14px 14px 0 0;max-width:none;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  #doca button{min-width:0;padding:6px 8px;flex:1;font-size:11px}
  #ticker{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  #rota{bottom:calc(94px + env(safe-area-inset-bottom,0px))}
  #oport{left:12px;right:12px;width:auto;bottom:calc(94px + env(safe-area-inset-bottom,0px))}
  .op-capa b{font-size:30px}
  #gaveta{top:auto;bottom:0;width:100%;max-height:84%;border-radius:16px 16px 0 0;z-index:30}
  .capa h2{font-size:50px}
  #gaveta.marc{max-height:56%}
  #gaveta.marc .capa{padding:10px 20px}
  #gaveta.marc .capa h2{font-size:30px}
  #terr{left:0;right:0;top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:auto;max-height:46%;border-radius:14px 14px 0 0}
  #terr h2{font-size:24px}
  .mesa{grid-template-columns:minmax(0,1fr)}
  .baralho{height:clamp(340px,calc(100vh - 340px),480px)}
  .carta .capa h2{font-size:70px}
  .titulo{font-size:36px}
  #painel{padding-bottom:90px}
  .leaflet-bottom{bottom:96px}
  .trio b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  #varredura{animation:none;display:none}
  #ticker .faixa{animation:none;overflow-x:auto}

}
@media print{
  body.imprimir #app,body.imprimir #mapa,body.imprimir #varredura,body.imprimir #aneis,body.imprimir #aviso,body.imprimir .fim{display:none!important}

  body.imprimir .cx-modal{background:#fff;color:#000;max-height:none;max-width:none}
  body.imprimir .tab-wrap{background:#fff} body.imprimir th,body.imprimir td{color:#000;border-color:#999}
}

/* ajustes do celular e notificacoes */

.fecha{position:sticky;top:10px;right:auto;display:block;margin:10px 12px -44px auto;z-index:5}
.x-modal{position:sticky;top:0;align-self:flex-end;flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--camada2);color:#fff;font-size:20px;line-height:1;margin-bottom:-48px;z-index:3}
.info{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--apagado);background:transparent;color:var(--apagado);font:600 13px/1 var(--corpo);vertical-align:middle;margin-left:4px}
.sino{width:17px;height:17px;display:block}
.notif{background:var(--camada2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;border-left:4px solid transparent;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.notif.nova{border-left-color:var(--af)}
.notif b{font-size:14px}
.op-linha{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:10px;background:var(--af);color:#111;padding:10px 12px;text-align:left}

.mcli{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.fx-chip{white-space:nowrap}
@media (max-width:820px){
  #aviso{left:0;right:0;top:0;transform:none;width:100%;max-width:none;border-radius:0;text-align:center;font-size:10px;padding:2px 8px;line-height:13px;height:17px}

}

  ${v.length?`<div class="bloco pq"><div class="t">Hoje</div>${v.map(x=>`<div>${esc(conta(x.quem).nome)} pegou ${x.n} em ${esc(x.cidade)}</div>`).join('')}</div>`:''}`,true);if(st.vista&&$('#topo'))pintarTopo();}

function pintarTicker(){const r=[...leads].sort((a,b)=>b.det-a.det).slice(0,14),it=r.map(l=>`<button onclick="abrir('${l.id}',true)"><i class="${l.tipo}">${TIPO[l.tipo].g}</i>${esc(l.nome)} · ${esc(l.cidade)} · ${haQuanto(l.det)}</button>`).join('');

function modalFiltros(){const f=st.f,donos=[['','Todos'],['__sem','Sem dono'],...(souAdm()?vendedores().filter(c=>!c.bloq).map(c=>[c.id,c.nome]):[[st.eu.id,'Meus']])];abrirModal(`<h3>Filtrar</h3>

function abrir(id,voar){st.aberto=id;st.marcando=null;const x=achar(id);if(x&&x.tipo!=='CAMPO')contar('abertos');pintarGaveta();$('#gaveta').scrollTop=0;pintarMapa();pintarOport();if(voar&&mapa&&x)mapa.flyTo([x.lat,x.lng],15,{duration:.8});}
function fecharGaveta(){st.aberto=null;st.marcando=null;desenharPino();pintarGaveta();pintarMapa();pintarOport();if(st.vista==='territorio')pintarTerr();}
const FECHA='<button class="fecha" aria-label="Fechar" onclick="fecharGaveta()">×</button>';
function pintarGaveta(){const g=$('#gaveta');
  g.classList.toggle('marc',!!st.marcando);
  if(st.marcando){g.hidden=false;g.innerHTML=FECHA+formMarcar();atualizarChecagem();return;}
  const x=st.aberto&&achar(st.aberto);if(!x){g.hidden=true;g.innerHTML='';return;}
  g.hidden=false;g.innerHTML=FECHA+(x.tipo==='CAMPO'?dossieObra(x):dossieLead(x));}
const donoHtml=id=>{const c=conta(id);return c?`<span class="dono"><i style="background:${c.cor}">${c.l}</i>${esc(c.nome)}</span>`:'';};
function corpoLead(l){const g=grupo(l),au=g.filter(x=>x.tipo!=='PRO'),pr=g.filter(x=>x.tipo==='PRO'),bl=[],et=etapa(l);
  if(et)bl.push(`<div class="etapa ${et.k}" id="b-etapa"><b>${ETAPA[et.k][0]}</b><div class="pq" style="margin-top:4px">${ETAPA[et.k][1]} Protocolo de ${fmtData(et.pro.data)}. Este lead continua ativo.</div></div>`);
  if(au.length){const pz=au.map(prazoEf).filter(x=>x!=null),fut=pz.filter(x=>x>=0),p=fut.length?Math.min(...fut):pz.length?Math.max(...pz):null,ex=[...new Set(au.flatMap(x=>x.exig||[]))],feita=e=>PROJ.test(e)&&au.some(x=>cobre(x)&&(x.exig||[]).includes(e));

    if(p==null&&!ex.length)bl.push(`<div class="bloco pq apagado" data-sem-detalhe>Sem exigências e prazo registrados.</div>`);
    if(p!=null)bl.push(`<div class="bloco prazo ${p<=15?'urg':''}"><b>${Math.abs(p)}</b><div><div style="font:800 19px var(--display)">${p<0?'DIAS VENCIDO':'DIAS DE PRAZO'}</div><div class="pq apagado">para corrigir as exigências</div></div></div>`);
    if(ex.length)bl.push(`<div class="bloco"><div class="t">Exigências</div><div class="exigs">${ex.map(e=>`<span class="${feita(e)?'feita':''}">${esc(e)}</span>`).join('')}</div>${ex.some(feita)?'<div class="pq apagado" style="margin-top:6px">Riscada: em tese atendida pelo protocolo. A confirmar.</div>':''}</div>`);}
  pr.slice(0,2).forEach(x=>{bl.push(`<div class="bloco"><div class="t">Situação do projeto</div><div style="font:900 30px/1 var(--display);color:${x.sit[1]==='def'?'var(--livre)':x.sit[1]==='ind'?'#FF6078':'var(--af)'}">${esc(x.sit[0]).toUpperCase()}</div><div class="pq apagado">${fmtData(x.data||x.det)}${x.anexos?' · '+x.anexos+' anexo(s) no e-SCI':''}</div></div>`);});

  ${blocoVisitas(o,pode)}${blocoVenda(o)}
  ${pode?`<div class="bloco"><div class="t">Situação</div><div class="seg" id="seg-stat">${STAT.map(([k,t])=>`<button class="${o.status===k?'on':''}" onclick="marcar('${o.id}','${k}')">${t}</button>`).join('')}</div></div>
   ${o.obs?`<div class="bloco"><div class="t">Observação privada</div><div class="pq">${esc(o.obs)}</div></div>`:''}`:`<div class="bloco pq apagado" id="so-dono">Situação da negociação e observações só o dono e o administrador veem.</div>`}
  <div class="linha">${pode?`<button class="btn forte" id="b-visita" onclick="modalVisita('${o.id}')">REGISTRAR VISITA</button><button class="btn" onclick="editarObs('${o.id}')">Observação</button><button class="btn" onclick="soltarObra('${o.id}')">Liberar cliente</button>`:''}
  ${souAdm()?`<button class="btn" id="b-passar" onclick="modalAtribuir('${o.id}')">Passar para</button><button class="btn" id="b-prot" onclick="modalProt(achar('${o.id}').nome,'${o.dono}')">Proteger cliente</button>`:''}<button class="btn" onclick="alternarRota('${o.id}')">${naRota?'Tirar da rota':'Pôr na rota'}</button></div></div>`;}

/* ========== ações ========== */
function pegar(id){const l=achar(id);if(l.dono)return toast('Este lead já tem dono.');
  if(souAdm())return modalAtribuir(id);
  const cf=checar(l,st.eu.id);
  if(cf.length)return abrirModal(`<h3>Obra de ${esc(conta(cf[0].o.dono).nome)} aqui perto</h3><p style="margin:0">${esc(cf[0].o.nome)}, ${cf[0].mot.join(', ')}. O administrador decide quem fica. Pedir com visita comprovada dá mais força ao pedido.</p>
    <div class="fim"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="m-prova" onclick="modalVisita('${id}',true)">Estou na obra: comprovar</button><button class="btn" id="m-pedir" style="background:#fff;color:#111" onclick="pedirLead('${id}','${cf[0].o.id}')">Pedir ao administrador</button></div>`);
  gr(l).forEach(x=>x.dono=st.eu.id);contar('pegos');toast(grupo(l).length>1?'Edificação é sua: '+resumoG(l)+'.':'Lead é seu.');pintar();}
function pedirLead(id,oid){pedidos.push({id:'P'+(seqPed++),tipo:'lead',quem:st.eu.id,alvo:oid,lead:id,quando:Date.now(),st:'aberto'});fecharModal();toast('Pedido enviado ao administrador.');pintar();}
function modalAtribuir(id){const l=achar(id),cf=checar(l,null);abrirModal(`<h3>Atribuir lead</h3><p class="apagado pq" style="margin:0">${esc(l.nome)}</p>${cf.length?`<div class="alerta-terr pq">Atenção: ${esc(conta(cf[0].o.dono).nome)} tem obra ${cf[0].mot.join(', ')}.</div>`:''}
  <label class="c">Vendedor<select class="inp" id="m-v">${contas.filter(v=>!v.bloq).map(v=>`<option value="${v.id}">${esc(v.nome)}</option>`).join('')}</select></label>
  <div class="fim"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="m-ok" style="background:#fff;color:#111" onclick="atribuir('${id}')">Atribuir</button></div>`);}
function atribuir(id){const l=achar(id),nv=$('#m-v').value,ant=l.dono;gr(l).forEach(x=>{x.dono=nv;x.liberado=!!x.prot;});if(ant&&ant!==nv&&ant!=='adm')notificar(ant,'Lead removido da sua carteira',l.nome+' · '+l.cidade);if(nv!=='adm')notificar(nv,'Novo lead direcionado para você',l.nome+' · '+l.cidade,l.id);fecharModal();toast('Atribuído a '+conta(l.dono).nome+'.');pintar();}
function soltar(id){const l=achar(id);if(l.dono!==st.eu.id&&!souAdm())return toast('Só o dono ou o administrador pode soltar.');if(souAdm()&&l.dono&&l.dono!==st.eu.id)notificar(l.dono,'Lead removido da sua carteira',l.nome+' · '+l.cidade);gr(l).forEach(x=>{x.dono=null;x.status='novo';x.obs='';x.liberado=!!x.prot;});toast('Voltou para a fila.');pintar();}
function marcar(id,s){const x=achar(id);if(x.dono!==st.eu.id&&!souAdm())return;gr(x).forEach(y=>y.status=s);contar('marcados');pintar();}
function editarObs(id){const x=achar(id);if(x.dono!==st.eu.id&&!souAdm())return;abrirModal(`<h3>Observação</h3><p class="apagado pq" style="margin:0">${esc(x.nome)}. Só o dono e o administrador leem.</p><textarea class="inp" id="m-obs" rows="4">${esc(x.obs)}</textarea><div class="fim"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="m-ok" style="background:#fff;color:#111" onclick="salvarObs('${id}')">Salvar</button></div>`);}
function salvarObs(id){const v=$('#m-obs').value.trim();gr(achar(id)).forEach(y=>y.obs=v);fecharModal();pintar();}
function abrirESci(id){try{navigator.clipboard&&navigator.clipboard.writeText(id).catch(()=>{});}catch(e){}contar('abertos');toast('Esboço: código '+id+' copiado; abriria o e-SCI.');}
function alternarRota(id){const i=st.rota.indexOf(id);i>=0?st.rota.splice(i,1):st.rota.push(id);pintar();}
function modalVisita(id,pegando){const x=achar(id);abrirModal(`<h3>${pegando?'Pegar com visita comprovada':'Registrar visita'}</h3><p class="apagado pq" style="margin:0">${esc(x.nome)}</p>
  <p style="margin:0" id="v-aviso">Vamos usar o GPS do celular para confirmar a visita.<button class="info" id="v-i" aria-label="Mais informações" onclick="$('#v-info').hidden=!$('#v-info').hidden">i</button></p><div class="bloco pq" id="v-info" hidden>A posição é lida uma única vez, neste toque, para comparar com o endereço da obra. O local não fica guardado e ninguém acompanha onde você está. Ficam registrados só a data, a hora e a distância até a obra.</div>
  <div id="v-res"></div><div class="pilha"><button class="btn forte" id="v-perto" onclick="confirmarVisita('${id}',35,${!!pegando})">ESTOU NA OBRA</button>
  <button class="btn" id="v-longe" onclick="confirmarVisita('${id}',4200,${!!pegando})">Teste: simular que estou longe</button>
  ${pegando?'':`<button class="btn" id="v-sem" onclick="confirmarVisita('${id}',null,false)">Registrar sem GPS</button>`}</div>
  <div class="fim"><button class="btn" onclick="fecharModal()">Cancelar</button></div>`);}
function confirmarVisita(id,m,pegando){const x=achar(id);
  if(m!=null&&m>st.cfg.prova){$('#v-res').innerHTML=`<div class="erro" id="v-erro">Você está a ${(m/1000).toLocaleString('pt-BR')} km da obra, e o limite é de ${st.cfg.prova} m. A visita não foi comprovada.</div>`;return;}
  const prova=m!=null,v={t:Date.now(),prova,m};
  if(pegando){const cf=checar(x,st.eu.id);
    if(cf.length){pedidos.push({id:'P'+(seqPed++),tipo:'lead',quem:st.eu.id,alvo:cf[0].o.id,lead:id,prova:{m},quando:Date.now(),st:'aberto'});contar('comprovadas');fecharModal();toast('Pedido enviado com visita comprovada.');return pintar();}
    gr(x).forEach(y=>y.dono=st.eu.id);contar('pegos');}
  else if(x.dono!==st.eu.id&&!souAdm())return;
  x.visitas.push(v);if(x.tipo==='CAMPO')x.ultVisita=v.t;contar('visitas');if(prova)contar('comprovadas');fecharModal();
  toast(prova?'Visita comprovada a '+m+' m.':'Visita registrada sem comprovação.');pintar();}
function blocoVenda(x){if(!souAdm()||x.status!=='fechado')return '';return `<div class="bloco" id="b-venda"><div class="t">O que foi vendido (só você vê)</div><div class="chips">${VENDAS.map(k=>`<button class="chip ${x.vendido.includes(k)?'on':''}" onclick="alternarVenda('${x.id}','${k}')">${k}</button>`).join('')}</div></div>`;}
function alternarVenda(id,k){if(!souAdm())return;const x=achar(id),i=x.vendido.indexOf(k);i>=0?x.vendido.splice(i,1):x.vendido.push(k);pintar();}
function blocoVisitas(x,pode){const vs=[...(x.visitas||[])].reverse();if(!vs.length)return '';const n=vs.filter(v=>v.prova).length,u=ultProva(x);
  return `<div class="bloco" id="b-visitas"><div class="t">Visitas</div><div class="linha" style="margin-bottom:5px"><span class="selo ${n?'ok':'foi'}">${n?n+' comprovada(s)':'Nenhuma comprovada'}</span>${pode?'':(u?`<span class="pq apagado">Última comprovada ${haQuanto(u.t)}</span>`:'')}</div>${pode?vs.slice(0,3).map(v=>`<div class="pq">${haQuanto(v.t)} · ${v.prova?'Comprovada a '+v.m+' m':'Sem comprovação'}</div>`).join(''):''}</div>`;}
function soltarObra(id){const o=achar(id);if(o.dono!==st.eu.id&&!souAdm())return;removerCliente(o,souAdm()&&o.dono!==st.eu.id);st.aberto=null;toast('Obra liberada.');pintar();}

/* ========== clientes protegidos ========== */
function novoProt(d){const p=Object.assign({id:'CP'+(seqProt++),nome:'',termos:[],doc:'',res:[],dono:'adm',desde:Date.now()},d);protegidos.push(p);return p;}
const temTermo=(txt,t)=>norm(t).length>=3&&(' '+norm(txt)+' ').includes(' '+norm(t)+' ');
const protDe=l=>protegidos.find(p=>(l.re&&p.res.includes(l.re))||p.termos.some(t=>temTermo(l.nome,t)));
const achaProt=id=>protegidos.find(p=>p.id===id);
function aplicarProtegidos(){st.hits=[];unicos(leads).forEach(l=>{const p=gr(l).map(protDe).find(Boolean);gr(l).forEach(x=>{x.prot=p?p.id:null;if(p&&!x.liberado)x.dono=p.dono;});if(p)st.hits.push({prot:p.id,id:l.id});});}
function docBate(doc,dg){const d=(doc||'').replace(/\D/g,'');if(!d||dg.length<8)return false;return d.length===14?d.slice(0,8)===dg.slice(0,8):d===dg;}
function buscaProt(q){const dg=String(q||'').replace(/\D/g,''),n=norm(q);return protegidos.find(p=>p.termos.some(t=>temTermo(q,t))||(n.length>=4&&norm(p.nome).includes(n))||docBate(p.doc,dg));}
const barrado=p=>p&&!souAdm()&&p.dono!==st.eu.id;
function blocoProt(l){const p=achaProt(l.prot);if(!p)return '';if(l.liberado)return `<div class="alerta-terr prot pq" id="alerta-prot"><b>LIBERADO</b>O administrador autorizou ${esc(conta(l.dono)?conta(l.dono).nome:'')} neste cliente protegido.</div>`;
  const ja=pedidos.some(x=>x.tipo==='prot'&&x.lead===l.id&&x.quem===st.eu.id&&x.st==='aberto');
  return `<div class="alerta-terr prot" id="alerta-prot"><b>CLIENTE PROTEGIDO</b><span class="pq">${esc(p.nome)} é de ${esc(conta(p.dono).nome)}. Só entra com autorização do administrador.</span>${barrado(p)?`<div style="margin-top:8px">${ja?'<span class="pq apagado">Pedido enviado. Aguarde a decisão.</span>':`<button class="btn pq" id="b-pedir-prot" onclick="pedirProt('${p.id}','${l.id}')">Pedir autorização</button>`}</div>`:''}</div>`;}
function pedirProt(pid,lid,nova){pedidos.push({id:'P'+(seqPed++),tipo:'prot',quem:st.eu.id,prot:pid,lead:lid||null,nova:nova||null,quando:Date.now(),st:'aberto'});toast('Pedido enviado ao administrador.');pintar();}
function nomePedido(p){return p.lead?achar(p.lead).nome:p.nova?p.nova.nome:p.tipo==='prot'?achaProt(p.prot).nome:'';}
function cartaProt(p){const c=achaProt(p.prot),q=conta(p.quem);return `<article class="conflito" data-p="${p.id}" data-prot-ped><h3>${esc(nomePedido(p))}</h3><div class="pq">${esc(q.nome)} pediu autorização ${haQuanto(p.quando)}. Cliente protegido de ${esc(c?conta(c.dono).nome:'')}.</div><div class="linha"><button class="btn" data-acao="nega" onclick="decidir('${p.id}','nega')">Negar</button><button class="btn" data-acao="autoriza" style="background:#fff;color:#111" onclick="decidir('${p.id}','autoriza')">Autorizar ${esc(q.nome)}</button></div></article>`;}
function cmdProt(){$('#cmd').innerHTML=`<div class="linha" style="margin-bottom:12px"><span class="pq apagado">Todos veem que o cliente tem dono. Documento e termos de busca só você vê.</span><span class="esp"></span><button class="btn pq" id="b-novo-prot" style="background:#fff;color:#111" onclick="modalProt()">Novo cliente protegido</button></div>
  ${blocoRevisao()}<div class="secao" style="margin-bottom:8px">Clientes protegidos e fidelizados</div><div class="pilha" id="lista-prot">${protegidos.map(p=>{const hs=st.hits.filter(h=>h.prot===p.id).map(h=>achar(h.id));return `<article class="conflito" data-prot="${p.id}"><div class="linha"><h3>${esc(p.nome)}</h3><span class="esp"></span>${donoHtml(p.dono)}</div><div class="pq apagado">Busca: ${esc(p.termos.join(', '))||'—'}${p.doc?' · Documento: <span class="mono">'+esc(p.doc)+'</span>':''}</div>${p.fid&&achar(p.fid)&&achar(p.fid).retorno?`<div class="pq">Retorno previsto: ${fmtRet(achar(p.fid))}</div>`:''}<div class="pq">${hs.length?hs.length+' edificação(ões) encontrada(s):':'Nenhum registro encontrado.'}</div>${hs.map(h=>`<button style="all:unset;cursor:pointer;text-decoration:underline" class="pq" onclick="st.vista='radar';pintar();abrir('${h.id}',true)">${resumoG(h)} · ${esc(h.nome)} · ${esc(h.cidade)}</button>`).join('')}<div class="linha"><button class="btn pq perigo" onclick="removerProt('${p.id}')">Remover proteção</button>${p.fid&&achar(p.fid)?`<button class="btn pq" onclick="st.vista='radar';pintar();abrir('${p.fid}',true)">Ver cliente</button>`:''}</div></article>`;}).join('')||'<div class="bloco apagado">Nenhum cliente protegido.</div>'}</div>`;}
function modalProt(nome,dono){abrirModal(`<h3>Cliente protegido</h3><div class="erro" id="m-erro" hidden></div><label class="c">Nome do cliente<input class="inp" id="p-nome" value="${esc(nome||'')}"></label><label class="c">Buscar nos registros por (separe com vírgula)<input class="inp" id="p-termos" value="${esc(nome||'')}"></label><label class="c">CNPJ ou CPF (opcional, só você vê)<input class="inp" id="p-doc" inputmode="numeric" autocomplete="off"></label><label class="c">Vendedor dono<select class="inp" id="p-dono">${contas.filter(c=>!c.bloq).map(c=>`<option value="${c.id}" ${(dono||'adm')===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><div class="fim"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn" id="p-ok" style="background:#fff;color:#111" onclick="salvarProt()">Proteger</button></div>`);}
function salvarProt(){const e=$('#m-erro'),f=t=>{e.textContent=t;e.hidden=false;},n=$('#p-nome').value.trim(),te=$('#p-termos').value.split(',').map(x=>x.trim()).filter(Boolean),dg=$('#p-doc').value.replace(/\D/g,'');
  if(n.length<3)return f('Informe o nome do cliente.');if(te.some(t=>norm(t).length<3))return f('Cada termo precisa ter pelo menos 3 letras.');if(!te.length&&!dg)return f('Informe um termo de busca ou um documento.');if(dg&&dg.length!==11&&dg.length!==14)return f('CNPJ tem 14 dígitos e CPF tem 11.');
  novoProt({nome:n,termos:te,doc:dg,dono:$('#p-dono').value});aplicarProtegidos();fecharModal();toast(n+' protegido.');st.vista='comando';st.cmd='protegidos';st.aberto=null;pintar();}
function removerProt(id){protegidos.splice(protegidos.findIndex(p=>p.id===id),1);leads.forEach(l=>{if(l.prot===id)l.liberado=false;});aplicarProtegidos();toast('Proteção removida. O dono atual continua.');pintar();}

/* ========== rota ========== */
function linksMaps(it,n){const out=[];for(let i=0;i<it.length;i+=n){out.push('https://www.google.com/maps/dir/'+it.slice(i,i+n).map(l=>encodeURIComponent(`${l.rua} ${l.num}, ${l.cidade}, SC`)).join('/'));}return out;}
function qrSvg(t){try{if(typeof qrcode==='undefined')throw 0;const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2});}catch(e){return '<div style="color:#111" class="pq">QR indisponível sem internet</div>';}}
function moverRota(i,d){const a=st.rota,t=a[i];a[i]=a[i+d];a[i+d]=t;modalRota();pintarMapa();}
function modalRota(){const it=st.rota.map(achar).filter(Boolean),url=(linksMaps(st.rota.map(achar).filter(Boolean),10)[0]||location.href),mp=linksMaps(it,10);
  abrirModal(`<h3>Rota · ${it.length} parada(s)</h3><div class="qr" id="m-qr">${qrSvg(url)}</div>
  <div class="tab-wrap"><table id="t-rota"><tr><th>#</th><th>Local</th><th>Endereço</th><th></th></tr>${it.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.nome)}</td><td>${esc(p.rua)}, ${p.num} · ${esc(p.cidade)}</td><td class="n" style="white-space:nowrap"><button class="btn pq" ${i?'':'disabled'} onclick="moverRota(${i},-1)">↑</button> <button class="btn pq" ${i<it.length-1?'':'disabled'} onclick="moverRota(${i},1)">↓</button></td></tr>`).join('')}</table></div>
  <div class="linha">${mp.map((m,i)=>`<a class="btn pq" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(m)}">Abrir no Maps${mp.length>1?' · trecho '+(i+1):''}</a>`).join('')}</div>
  <div class="fim"><button class="btn" onclick="fecharModal()">Fechar</button><button class="btn" id="m-rel" onclick="relatorio()">Relatório</button></div>`,true);}
function relatorio(){const it=st.rota.map(achar).filter(Boolean);abrirModal(`<div id="rel" class="pilha"><h3>Relatório de captação</h3><p class="pq" style="margin:0">${fmtData(Date.now())} · ${esc(st.eu.nome)} · ${it.length} parada(s)</p><div class="tab-wrap"><table><tr><th>#</th><th>Local</th><th>Endereço</th><th>Situação</th><th>Observação</th></tr>${it.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.nome)}</td><td>${esc(p.rua)}, ${p.num} · ${esc(p.cidade)}</td><td>${p.dono===st.eu.id||souAdm()?nomeStat(p.status):'—'}</td><td>${p.dono===st.eu.id||souAdm()?esc(p.obs):''}</td></tr>`).join('')}</table></div></div>
  <div class="fim"><button class="btn" onclick="modalRota()">Voltar</button><button class="btn" style="background:#fff;color:#111" onclick="imprimir()">Imprimir ou salvar em PDF</button></div>`,true);}
function imprimir(){document.body.classList.add('imprimir');window.print();document.body.classList.remove('imprimir');}

/* ========== fila ========== */
function filaAtual(){return unicos(leads.filter(l=>!l.dono&&st.tipos.has(l.tipo)&&passaFiltro(l)&&!st.pulados.has(l.id)).sort((a,b)=>rankFila(a)-rankFila(b)||((prazoEf(a)==null?9999:Math.abs(prazoEf(a)))-(prazoEf(b)==null?9999:Math.abs(prazoEf(b))))));}
function rankFila(l){if(ehNovo(l))return 0;const pz=prazoEf(l);if(pz!=null&&pz>=0&&pz<=30)return 1;if(etapa(l)&&etapa(l).k==='executar')return 1.5;return ({MUL:2,AF:3,PRO:4})[l.tipo];}
function pintarFila(){const q=filaAtual(),m=st.filaModo;
  const cab=`<div class="linha"><h1 class="titulo">Fila</h1><span class="esp"></span><span class="seg" id="seg-fila"><button class="${m==='cartas'?'on':''}" onclick="st.filaModo='cartas';pintar()">Cartas</button><button class="${m==='lista'?'on':''}" onclick="st.filaModo='lista';pintar()">Lista</button></span></div>
  <div class="chips" style="margin:6px 0 16px">${['MUL','AF','PRO'].map(t=>`<button class="chip ${st.tipos.has(t)?'on':''}" onclick="alternarTipo('${t}')">${TIPO[t].g}</button>`).join('')}<span class="pq apagado" id="fila-qt" style="align-self:center">${q.length} sem dono</span></div><p class="so-cel pq apagado" style="margin:-8px 0 12px">Arraste a carta para a direita para pegar e para a esquerda para pular.</p>`;
  if(m==='lista'){$('#painel').innerHTML=`<div class="pagina">${cab}<div class="grade-tick" id="lista">${q.slice(0,60).map(tick).join('')||'<div class="apagado">Nada com esses filtros.</div>'}</div>${q.length>60?`<p class="apagado pq">Mostrando 60 de ${q.length}. Use os filtros para refinar.</p>`:''}</div>`;return;}
  const[a,b,c]=q;
  $('#painel').innerHTML=`<div class="pagina">${cab}<div class="mesa"><div>
   <div class="baralho" id="baralho">${c?`<div class="carta tras2">${carta(c)}</div>`:''}${b?`<div class="carta tras">${carta(b)}</div>`:''}${a?`<div class="carta topo" id="carta" data-id="${a.id}"><span class="carimbo pega">PEGAR</span><span class="carimbo pula">PULAR</span>${carta(a)}</div>`:`<div class="bloco" style="text-align:center;padding:40px"><h3 style="font-size:32px">Fila vazia</h3><p class="apagado">Você viu tudo o que está sem dono com esses filtros.</p>${st.pulados.size?`<button class="btn" onclick="st.pulados.clear();pintar()">Ver os ${st.pulados.size} que pulei</button>`:''}</div>`}</div>
   ${a?`<div class="controle"><button class="btn" id="b-pular" onclick="pular()">Pular</button><button class="btn" onclick="alternarRota('${a.id}');toast(st.rota.includes('${a.id}')?'Na rota.':'Fora da rota.')">Pôr na rota</button><button class="btn forte" id="b-pegar-c" onclick="pegarCarta()">PEGAR</button></div>`:''}</div>
   <div class="lateral so-pc"><div class="bloco"><div class="t">Como usar</div><div class="pq">Arraste a carta para a direita para pegar e para a esquerda para pular. No teclado: <span class="atalho">→</span> pegar, <span class="atalho">←</span> pular.</div></div>
   <div class="bloco"><div class="t">Ordem da fila</div><div class="pq">Novos primeiro, depois quem vence em até 30 dias, projetos deferidos para executar, multas, AF e protocolos.</div></div>
   <div class="bloco"><div class="t">Hoje</div><div class="pq">${st.rota.length} na rota · ${leads.filter(l=>l.dono===st.eu.id).length} na sua carteira</div></div></div></div></div>`;
  if(a){ligarArraste($('#carta'),a.id);$('#carta .miolo').scrollTop=0;}}
function carta(l){const cf=checar(l,st.eu.id);return `<div class="capa ${simbolo(l)}"><h2>${TIPO[simbolo(l)].g}</h2><div class="sub">${subG(l)}${ehNovo(l)?' · NOVO':''}</div></div><div class="miolo"><div class="pilha" style="gap:3px"><h3>${esc(l.nome)}</h3><div class="pq">${esc(l.rua)}, ${l.num} · ${esc(l.cidade)}</div><div class="pq apagado">${area(areaG(l))} · <span class="mono">${l.id}</span></div></div>${blocoProt(l)}${blocoPend(l)}${cf.length?`<div class="alerta-terr pq"><b>${esc(conta(cf[0].o.dono).nome)} já trabalha aqui</b>${cf[0].mot.join(', ')}</div>`:''}${corpoLead(l)}</div>`;}
function tick(l){return `<button class="tick" data-id="${l.id}" onclick="abrir('${l.id}')"><div class="faixa ${simbolo(l)}"><b>${TIPO[simbolo(l)].g}</b><span class="esp"></span>${grupo(l).length>1?`<span class="pq" style="font-weight:700">${resumoG(l)}</span>`:''}${ehNovo(l)?'<span class="pq" style="font-weight:700">NOVO</span>':''}</div><div class="corpo"><h4>${esc(l.nome)}</h4><div class="pq">${esc(l.rua)}, ${l.num} · ${esc(l.cidade)}</div>${(l.pend||[])[0]?`<div class="pd">${esc(l.pend[0])}</div>`:''}<div class="pq apagado">${area(l.area)}${prazoEf(l)!=null?(prazoEf(l)<0?' · vencido há '+(-prazoEf(l))+' dia(s)':' · prazo '+prazoEf(l)+' dia(s)'):''}${l.sit?' · '+l.sit[0]:''}${etapa(l)?' · '+ETAPA[etapa(l).k][0]:''}</div></div></button>`;}
function pular(){const q=filaAtual();if(q[0]){gr(q[0]).forEach(x=>st.pulados.add(x.id));pintar();}}
function pegarCarta(){const q=filaAtual();if(q[0])pegar(q[0].id);}
function ligarArraste(el,id){let x0=0,dx=0,ativo=false;
  el.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;ativo=true;x0=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.style.transition='none';});
  el.addEventListener('pointermove',e=>{if(!ativo)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;el.querySelector('.pega').style.opacity=Math.max(0,dx/120);el.querySelector('.pula').style.opacity=Math.max(0,-dx/120);});
  const fim=()=>{if(!ativo)return;ativo=false;el.style.transition='transform .18s';if(dx>110)return pegar(id);if(dx<-110)return pular();el.style.transform='';el.querySelector('.pega').style.opacity=0;el.querySelector('.pula').style.opacity=0;};
  el.addEventListener('pointerup',fim);el.addEventListener('pointercancel',fim);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal'))fecharModal();else if(st.aberto||st.marcando)fecharGaveta();}
  if(st.vista==='fila'&&st.filaModo==='cartas'&&!$('#modal')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')pegarCarta();if(e.key==='ArrowLeft')pular();}});

/* ========== carteira ========== */
function itensCart(id){return[...unicos(leads.filter(l=>l.dono===id)),...obras.filter(o=>o.dono===id)];}
function pintarMeusClientes(id){const cs=obras.filter(o=>o.dono===id&&obraAtiva(o)),pend=pedidos.filter(p=>p.tipo==='cad'&&p.st==='aberto'&&p.quem===id);
  return `<div class="mcli" id="meus-clientes">${pend.map(p=>`<div class="notif nova" data-pend="${p.id}"><b>${esc(p.nova.nome)}</b><span class="pq">${esc(p.nova.cidade)}</span><span class="selo vai" style="align-self:flex-start">Aguardando aprovação</span></div>`).join('')}${cs.map(o=>`<button class="notif" data-cli="${o.id}" onclick="abrir('${o.id}')"><b>${esc(o.nome)}</b><span class="pq">${esc(o.cidade)}${o.area?' · '+area(o.area):''}</span><span class="pq apagado">${o.retorno?'Retorno em '+fmtRet(o):'Última visita '+haQuanto(o.ultVisita)}</span></button>`).join('')||(pend.length?'':'<div class="bloco apagado">Nenhum cliente ainda. Cadastre em Território.</div>')}</div>`;}
function pintarCarteira(){const id=souAdm()?st.quemCart:st.eu.id,it=itensCart(id);
  $('#painel').innerHTML=`<div class="pagina"><div class="linha"><h1 class="titulo">${souAdm()?'Carteira de '+esc(conta(id).nome):'Minha carteira'}</h1><span class="esp"></span>${souAdm()?`<span class="seg" id="seg-quem">${vendedores().map(v=>`<button class="${v.id===id?'on':''}" onclick="st.quemCart='${v.id}';pintar()">${esc(v.nome)}</button>`).join('')}</span>`:''}</div>
  <div class="linha" style="margin:6px 0 12px"><span class="seg" id="seg-cart"><button class="${st.cartModo==='funil'?'on':''}" onclick="st.cartModo='funil';pintar()">Funil</button><button class="${st.cartModo==='clientes'?'on':''}" onclick="st.cartModo='clientes';pintar()">Meus clientes</button></span><span class="pq apagado so-pc">${st.cartModo==='funil'?'Arraste entre as colunas.':''}</span></div>
  ${st.cartModo==='clientes'?pintarMeusClientes(id):`<div class="quadro" id="quadro">${STAT.map(([k,t])=>{const c=it.filter(x=>x.status===k);return `<section class="coluna ${k}" data-k="${k}" ondragover="event.preventDefault();this.classList.add('sobre')" ondragleave="this.classList.remove('sobre')" ondrop="soltarCart(event,'${k}')"><header>${t}<span>${c.length}</span></header>${c.map(cart).join('')||'<span class="pq apagado">Vazio</span>'}</section>`;}).join('')}</div>`}</div>`;}
function cart(x){const camp=x.tipo==='CAMPO',cor=camp?'#fff':({MUL:'var(--mul)',AF:'var(--af)',PRO:'var(--pro)'})[x.tipo];
  return `<article class="cart" draggable="true" data-id="${x.id}" style="--cor:${cor}" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')"><span class="tp">${resumoG(x)}</span><button style="all:unset;cursor:pointer" class="nome" onclick="abrir('${x.id}')">${esc(x.nome)}</button><span class="pq apagado">${esc(x.cidade)}</span>
  <select aria-label="Situação" onchange="marcar('${x.id}',this.value)">${STAT.map(([k,t])=>`<option value="${k}" ${x.status===k?'selected':''}>${t}</option>`).join('')}</select></article>`;}
function soltarCart(e,k){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id)marcar(id,k);}

/* ========== território ========== */
function filtroObra(o){const f=st.terrFiltro;if(f==='minhas')return o.dono===st.eu.id;if(f==='vencendo')return (souAdm()||o.dono===st.eu.id)&&precisaRevisar(o);return true;}
function seloObra(o){if(!souAdm()&&o.dono!==st.eu.id)return '<span class="selo">Com dono</span>';if(o.status==='fechado')return '<span class="selo ok">Fechado</span>';if(o.retorno&&retDate(o)>Date.now())return `<span class="selo bom">Retorno ${new Date(retDate(o)).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</span>`;return precisaRevisar(o)?'<span class="selo vai">Revisar</span>':'<span class="selo bom">Fidelizado</span>';}
function linhaObra(o){const d=conta(o.dono);return `<button class="linha-obra" data-obra="${o.id}" onclick="abrir('${o.id}',true)"><span class="av" style="background:${obraAtiva(o)?d.cor:'#536170'}">${d.l}</span><span class="d"><b>${esc(o.nome)}</b><span class="pq apagado">${esc(o.rua)}, ${o.num} · ${esc(o.cidade)}${ultProva(o)?' · comprovada':''}</span></span>${seloObra(o)}</button>`;}
function pintarTerr(){const f=st.terrFiltro,lst=obras.filter(filtroObra).sort(souAdm()?(a,b)=>precisaRevisar(b)-precisaRevisar(a)||a.nome.localeCompare(b.nome):(a,b)=>((b.dono===st.eu.id)-(a.dono===st.eu.id))||a.nome.localeCompare(b.nome)),meus=pedidos.filter(p=>p.quem===st.eu.id&&p.st==='aberto');
  const foco=document.activeElement&&document.activeElement.id==='t-busca';
  $('#terr').innerHTML=`<div class="cab"><h2>Antes de visitar, confira</h2>
   <input class="inp" id="t-busca" placeholder="Nome da obra ou endereço" value="${esc(st.busca)}" oninput="st.busca=this.value;pintarVeredito()" autocomplete="off">
   <div id="veredito"></div>
   <div class="linha"><button class="btn" id="b-marcar" style="background:#fff;color:#111" onclick="iniciarMarcacao()">Cadastrar cliente</button><button class="btn" id="b-perto" onclick="pertoDeMim()">Perto de mim</button></div>
   <div class="linha"><span class="seg" id="seg-terr">${[['todas','Todas'],['minhas','Minhas'],['vencendo','A revisar']].map(([k,t])=>`<button class="${f===k?'on':''}" onclick="st.terrFiltro='${k}';pintar()">${t}</button>`).join('')}</span></div>
   <div class="legenda">${vendedores().filter(v=>!v.bloq).map(v=>donoHtml(v.id)).join('')}</div></div>
   <div class="rola" id="t-lista">${meus.map(p=>`<div class="bloco pq"><b>Aguardando o administrador:</b> ${esc(nomePedido(p))}</div>`).join('')}${st.perto?blocoPerto():''}${lst.map(linhaObra).join('')||'<span class="pq apagado">Nenhuma obra aqui.</span>'}</div>`;
  pintarVeredito();if(foco){const i=$('#t-busca');i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
function pintarVeredito(){const v=$('#veredito');if(!v)return;const pb=buscaProt(st.busca);if(!barrado(pb)&&pendBusca(st.busca,souAdm()?null:st.eu.id)){v.innerHTML=`<div class="veredito ocupada" id="v-pend"><b>CADASTRO EM ANÁLISE</b><span class="pq">Já existe um cadastro para esta obra aguardando o administrador.</span></div>`;return;}
  if(barrado(pb)){const ja=pedidos.some(x=>x.tipo==='prot'&&x.prot===pb.id&&x.quem===st.eu.id&&x.st==='aberto');v.innerHTML=`<div class="veredito ocupada" id="v-prot"><b>CLIENTE PROTEGIDO</b><span class="pq">Este cliente é de ${esc(conta(pb.dono).nome)}. Só entra com autorização do administrador.</span>${ja?'<div class="pq">Pedido enviado.</div>':`<div style="margin-top:8px"><button class="btn pq" id="v-pedir" onclick="pedirProt('${pb.id}')">Pedir autorização</button></div>`}</div>`;return;}
  const r=buscaTerr(st.busca);if(!r){v.innerHTML='';return;}
  const tot=r.obras.length+r.leads.length;
  if(!tot){v.innerHTML=`<div class="veredito livre" id="v-livre"><b>NINGUÉM MARCOU</b><span class="pq">Nenhuma obra ou lead com esse nome ou endereço. Marque depois da visita.</span></div>`;return;}
  const it=[...r.obras.map(o=>({x:o,t:'campo'})),...r.leads.map(l=>({x:l,t:'lead'}))].slice(0,3);
  v.innerHTML=`<div class="veredito ocupada" id="v-ocup"><b>JÁ TEM DONO</b>${it.map(i=>`<div class="pq"><button style="all:unset;cursor:pointer;text-decoration:underline" onclick="abrir('${i.x.id}',true)">${esc(i.x.nome)}</button> · ${esc(conta(i.x.dono).nome)} · ${esc(i.x.cidade)}</div>`).join('')}</div>`;}
function pertoDeMim(){const[b,g]=CIDADES.Brusque;st.perto={lat:b,lng:g};st.terrFiltro='todas';pintar();if(mapa)mapa.flyTo([b,g],14,{duration:.8});toast('Esboço: posição simulada no centro de Brusque.');}
function blocoPerto(){const p=st.perto,ob=obras.filter(o=>obraAtiva(o)&&metros(p,o)<=1000),le=leads.filter(l=>metros(p,l)<=1000);
  return `<div class="bloco pq" id="b-resp-perto"><b>Em até 1 km de você:</b> ${ob.length} obra(s) com dono e ${le.length} lead(s) do radar. <button class="btn pq" onclick="st.perto=null;pintar()">Fechar</button></div>`;}
function iniciarMarcacao(){const c=NC[0],[la,lo]=CIDADES[c];st.aberto=null;st.marcando={nome:'',doc:'',rua:'',num:'',cidade:c,area:'',re:'',retorno:'',status:'contatado',obs:'',lat:la,lng:lo,manual:false,dono:'ana'};pintarGaveta();desenharPino();if(mapa)mapa.flyTo([la,lo],13,{duration:.6});}
function formMarcar(){const m=st.marcando;return `<div class="capa CAMPO" style="--cor-dono:#fff"><h2>CADASTRAR</h2><div class="sub">Cliente encontrado por você em campo</div></div>
  <div class="miolo"><label class="c">Nome da obra ou empresa<input class="inp" id="o-nome" value="${esc(m.nome)}" oninput="campoM('nome',this.value)" autocomplete="off"></label>
  <label class="c">CNPJ ou CPF (só você e o administrador veem)<input class="inp" id="o-doc" value="${esc(m.doc)}" inputmode="numeric" oninput="st.marcando.doc=this.value" autocomplete="off"></label>
  <div class="linha" style="flex-wrap:nowrap"><label class="c" style="flex:1;min-width:0">Rua<input class="inp" id="o-rua" value="${esc(m.rua)}" oninput="campoM('rua',this.value)" autocomplete="off"></label><label class="c" style="width:80px">Número<input class="inp" id="o-num" value="${esc(m.num)}" oninput="campoM('num',this.value)" autocomplete="off"></label></div>
  <label class="c">Cidade<select class="inp" id="o-cid" onchange="campoM('cidade',this.value)">${NC.map(c=>`<option ${m.cidade===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
  <div class="linha" style="flex-wrap:nowrap"><label class="c" style="flex:1;min-width:0">Metragem (m²)<input class="inp" id="o-area" type="number" min="0" inputmode="numeric" value="${esc(m.area)}" oninput="st.marcando.area=this.value"></label><label class="c" style="flex:1;min-width:0">RE(s), separados por vírgula<input class="inp" id="o-re" value="${esc(m.re)}" oninput="st.marcando.re=this.value" autocomplete="off"></label></div>
  <label class="c">Retorno previsto (opcional)<input class="inp" id="o-ret" type="month" value="${esc(m.retorno)}" oninput="st.marcando.retorno=this.value"></label>
  <label class="c">Observação (só você e o administrador leem)<textarea class="inp" id="o-obs" rows="2" placeholder="Ex.: cliente vai orçar em fevereiro" oninput="st.marcando.obs=this.value">${esc(m.obs)}</textarea></label>
  ${souAdm()?`<label class="c">Vendedor<select class="inp" id="o-dono" onchange="st.marcando.dono=this.value">${vendedores().filter(v=>!v.bloq).map(v=>`<option value="${v.id}" ${m.dono===v.id?'selected':''}>${esc(v.nome)}</option>`).join('')}</select></label>`:''}
  <div class="bloco pq"><b>Toque no mapa</b> ou arraste o pino branco até o local exato.</div>
  <div class="bloco pq" id="o-prova-b">${m.prova?`<span class="selo ok" id="o-prova-ok">Visita comprovada a ${m.prova.m} m do pino</span>`:`<button class="btn pq" id="o-prova" onclick="comprovarMarcacao()">Estou na obra: comprovar</button> <span class="apagado">Dá mais força ao seu cadastro.</span>`}</div>
  <div id="o-conf"></div><div class="erro" id="o-erro" hidden></div>
  <button class="btn forte" id="o-salvar" onclick="salvarObra()">${souAdm()?'CADASTRAR':'ENVIAR PARA APROVAÇÃO'}</button></div>`;}
function campoM(c,v){const m=st.marcando;m[c]=v;if(c==='cidade'&&!m.manual){[m.lat,m.lng]=CIDADES[v];desenharPino();if(mapa)mapa.panTo([m.lat,m.lng]);if(m.prova){m.prova=null;return pintarGaveta();}}atualizarChecagem();}
function pendDe(d,eu){return pedidos.find(p=>p.tipo==='cad'&&p.st==='aberto'&&p.quem!==eu&&((d.nome&&d.cidade===p.nova.cidade&&parecido(d.nome,p.nova.nome)>=.72)||(d.rua&&d.num&&d.cidade===p.nova.cidade&&norm(d.rua)===norm(p.nova.rua)&&String(d.num)===String(p.nova.num))));}
function pendBusca(q,eu){const n=norm(q);if(n.length<3)return null;const pal=n.split(' ');return pedidos.find(p=>p.tipo==='cad'&&p.st==='aberto'&&p.quem!==eu&&pal.every(x=>norm(p.nova.nome+' '+p.nova.rua+' '+p.nova.num+' '+p.nova.cidade).includes(x)));}
function blocoPend(l){if(l.prot||souAdm())return '';const p=pendDe(l,st.eu.id);return p?`<div class="alerta-terr prot pq" id="alerta-pend"><b>CADASTRO EM ANÁLISE</b>Outro cadastro para esta obra aguarda o administrador.</div>`:'';}
function atualizarChecagem(){const m=st.marcando,b=$('#o-conf');if(!m||!b)return;const pb=buscaProt(m.nome),eu=souAdm()?null:st.eu.id;
  if(barrado(pb)){b.innerHTML=`<div class="veredito ocupada" id="o-prot"><b>CLIENTE PROTEGIDO</b><span class="pq">Este cliente já tem dono. O administrador decide.</span></div>`;return;}
  const cf=checar(m,eu);if(cf.length){const c=cf[0];b.innerHTML=`<div class="veredito ocupada" id="o-ocup"><b>${esc(conta(c.o.dono).nome.toUpperCase())} JÁ ESTÁ AQUI</b><span class="pq">${esc(c.o.nome)} · ${c.mot.join(', ')}. O administrador decide.</span></div>`;return;}
  const pe=pendDe(m,eu);if(pe){b.innerHTML=`<div class="veredito ocupada" id="o-pend"><b>CADASTRO EM ANÁLISE</b><span class="pq">Já existe um cadastro anterior para esta obra. O administrador decide.</span></div>`;return;}
  b.innerHTML=m.nome.length>2?`<div class="veredito livre" id="o-livre"><b>NADA ENCONTRADO</b><span class="pq">Nenhum cliente com esse nome ou endereço até agora.</span></div>`:'';}
function salvarObra(){const m=st.marcando,e=$('#o-erro'),nome=m.nome.trim(),dg=m.doc.replace(/\D/g,''),f=t=>{e.textContent=t;e.hidden=false;};
  if(nome.length<3||!m.rua.trim())return f('Informe o nome e a rua da obra.');if(dg&&dg.length!==11&&dg.length!==14)return f('CNPJ tem 14 dígitos e CPF tem 11.');
  const dono=souAdm()?m.dono:st.eu.id,dados={nome,doc:dg,rua:m.rua.trim(),num:m.num.trim(),cidade:m.cidade,lat:m.lat,lng:m.lng,area:+m.area||null,re:m.re.trim(),retorno:m.retorno,status:m.status,obs:m.obs.trim(),dono,visitas:[{t:Date.now(),prova:!!m.prova,m:m.prova?m.prova.m:null}]};
  st.marcando=null;desenharPino();
  if(souAdm()){const o=aprovarCadastro(dados);st.aberto=o.id;toast('Cliente fidelizado para '+conta(dono).nome+'.');return pintar();}
  pedidos.push({id:'P'+(seqPed++),tipo:'cad',quem:st.eu.id,nova:dados,prova:m.prova?{m:m.prova.m}:null,quando:Date.now(),st:'aberto'});contar('visitas');if(m.prova)contar('comprovadas');toast('Cadastro enviado para aprovação.');pintar();}
function aprovarCadastro(d){const o=novaObra(Object.assign({},d,{fidelizado:true,desde:Date.now(),ultVisita:Date.now()}));novoProt({nome:d.nome,termos:[d.nome],doc:d.doc||'',res:(d.re||'').split(',').map(x=>x.trim()).filter(Boolean),dono:d.dono,fid:o.id});aplicarProtegidos();return o;}
function cartaCad(p){const d=p.nova,q=conta(p.quem),cf=checar(d,p.quem),pb=protegidos.find(x=>x.dono!==p.quem&&(x.termos.some(t=>temTermo(d.nome,t))||docBate(x.doc,d.doc||''))),ant=pedidos.find(x=>x!==p&&x.tipo==='cad'&&x.st==='aberto'&&x.quando<p.quando&&x.quem!==p.quem&&parecido(x.nova.nome,d.nome)>=.72&&x.nova.cidade===d.cidade);
  const avisos=[pb?`Cliente protegido de ${esc(conta(pb.dono).nome)}: ${esc(pb.nome)}.`:'',...cf.map(c=>`${esc(conta(c.o.dono).nome)} tem ${esc(c.o.nome)} (${c.mot.join(', ')}).`),ant?`${esc(conta(ant.quem).nome)} enviou um cadastro parecido antes.`:''].filter(Boolean);
  return `<article class="conflito" data-p="${p.id}" data-cad><div class="linha"><h3>${esc(d.nome)}</h3><span class="esp"></span>${donoHtml(p.quem)}</div>
  <div class="pq">${esc(d.rua)}, ${esc(d.num)} · ${esc(d.cidade)}${d.area?' · '+area(d.area):''}${d.re?' · RE '+esc(d.re):''}</div>
  <div class="pq apagado">Enviado ${haQuanto(p.quando)} (${fmtData(p.quando)} às ${fmtHora(p.quando)})${d.doc?' · Documento: <span class="mono">'+esc(d.doc)+'</span>':''}${p.prova?' · Visita comprovada a '+p.prova.m+' m':''}</div>

function dias14(){return Array.from({length:14},(_,i)=>{const d=new Date(AGORA-(13-i)*D);d.setHours(12,0,0,0);return d;});}
function funil(id){const it=itensCart(id),c=s=>it.filter(x=>x.status===s).length;const vs=it.flatMap(x=>x.visitas||[]);return{prov:vs.filter(v=>v.prova).length,semProv:vs.filter(v=>!v.prova).length,total:it.length,leads:leads.filter(l=>l.dono===id).length,campo:obras.filter(o=>o.dono===id).length,cont:c('contatado'),vis:c('visitar'),fech:c('fechado'),desc:c('descartado')};}

  $('#painel').innerHTML=`<div class="pagina"><h1 class="titulo">Comando</h1><div class="abas">${aba('equipe','Equipe')}${aba('registro','Registro diário')}${aba('conflitos','Pedidos'+(pend?' ('+pend+')':''))}${aba('protegidos','Clientes')}${aba('vendas','Vendas')}${aba('coleta','Coleta')}${aba('regras','Regras')}</div><div id="cmd"></div></div>`;
  ({equipe:cmdEquipe,registro:cmdRegistro,conflitos:cmdConflitos,protegidos:cmdProt,vendas:cmdVendas,coleta:cmdColeta,regras:cmdRegras})[c]();}

   ${ad?'':`<div class="trio"><div><b>${ho?ho.min:0}</b><span>min hoje</span></div><div><b>${f.leads}</b><span>leads</span></div><div><b>${f.campo}</b><span>campo</span></div><div><b>${f.fech}</b><span>fechados</span></div></div>

function cmdConflitos(){const abs=pedidos.filter(p=>p.st==='aberto'),hist=pedidos.filter(p=>p.st!=='aberto');
  $('#cmd').innerHTML=`<div class="pilha" id="conflitos">${abs.map(p=>{if(p.tipo==='cad')return cartaCad(p);if(p.tipo==='prot')return cartaProt(p);const o=achar(p.alvo),q=conta(p.quem),a=p.tipo==='lead'?achar(p.lead):p.nova;return `<article class="conflito" data-p="${p.id}"><h3>${esc(a.nome)}</h3><div class="pq">${esc(q.nome)} pediu esta ${p.tipo==='lead'?'lead do radar':'obra de campo'} ${haQuanto(p.quando)}. ${o?esc(conta(o.dono).nome)+' tem '+esc(o.nome)+(a.aprox?' (mesmo endereço)':' ('+Math.round(metros(a,o))+' m)')+'. Última visita '+haQuanto(o.ultVisita)+'.':'A obra original foi liberada.'}</div>
   ${forcaPedido(p,o,q)}
   <div class="linha"><button class="btn" data-acao="dono" onclick="decidir('${p.id}','mantem')">Fica com ${o?esc(conta(o.dono).nome):'o dono'}</button><button class="btn" data-acao="pede" style="background:#fff;color:#111" onclick="decidir('${p.id}','passa')">Passa para ${esc(q.nome)}</button>${p.tipo==='obra'?`<button class="btn" data-acao="ambos" onclick="decidir('${p.id}','ambos')">São obras diferentes</button>`:''}</div></article>`;}).join('')||'<div class="bloco apagado">Nenhum pedido aberto.</div>'}
   ${hist.length?`<h2 style="font-size:24px;margin-top:10px">Decididos</h2>${hist.map(p=>`<div class="bloco pq">${esc(nomePedido(p))} · ${esc(p.desc||'')}</div>`).join('')}`:''}</div>`;}
function forcaPedido(p,o,q){const dp=o?ultProva(o):null,np=o?(o.visitas||[]).filter(v=>v.prova).length:0,qp=p.prova,dn=o?conta(o.dono).nome:'Dono',sug=qp&&!dp?q.nome:dp&&!qp?dn:null;
  return `<div class="bloco pq" data-forca><div><b>${esc(dn)}:</b> ${np?np+' visita(s) comprovada(s), última '+haQuanto(dp.t):'nenhuma visita comprovada'}</div><div><b>${esc(q.nome)}:</b> ${qp?'visita comprovada a '+qp.m+' m, '+haQuanto(p.quando):'sem visita comprovada'}</div><div style="margin-top:6px">${sug?`<span class="selo ok">Prova mais forte: ${esc(sug)}</span>`:'<span class="selo vai">Nenhum lado tem vantagem de prova</span>'}</div></div>`;}
function decidir(id,acao){const p=pedidos.find(x=>x.id===id),o=achar(p.alvo),q=conta(p.quem);
  if(p.tipo==='cad')return decidirCad(p,acao);
  if(p.tipo==='prot'){if(acao==='autoriza'){if(p.lead)gr(achar(p.lead)).forEach(x=>{x.dono=p.quem;x.liberado=true;});if(p.nova)novaObra(p.nova);p.desc='autorizado para '+q.nome;}else p.desc='negado para '+q.nome;p.st='fechado';notificar(p.quem,acao==='autoriza'?'Autorização aprovada':'Autorização negada',nomePedido(p),p.lead||null);toast('Decisão registrada: '+p.desc+'.');return pintar();}
  if(acao==='passa'){if(p.tipo==='lead'){if(o)obras.splice(obras.indexOf(o),1);const l=achar(p.lead);gr(l).forEach(y=>y.dono=p.quem);if(p.prova)l.visitas.push({t:p.quando,prova:true,m:p.prova.m});}else{if(o)obras.splice(obras.indexOf(o),1);novaObra(p.nova);}p.desc='passou para '+q.nome;}
  else if(acao==='ambos'){novaObra(p.nova);p.desc='registradas como obras diferentes';}
  else p.desc='ficou com '+(o?conta(o.dono).nome:'o dono');
  p.st='fechado';notificar(p.quem,'Decisão do administrador',nomePedido(p)+': '+p.desc+'.');toast('Decisão registrada: '+p.desc+'.');pintar();}

function criarConta(){const n=$('#m-nome').value.trim(),m=$('#m-mail').value.trim().toLowerCase(),s=$('#m-s1').value,e=$('#m-erro'),f=t=>{e.textContent=t;e.hidden=false;};if(!n)return f('Informe o nome.');if(!/^\S+@\S+\.\S+$/.test(m))return f('E-mail inválido.');if(contas.some(c=>c.email===m))return f('Já existe conta com esse e-mail.');if(s.length<12)return f('Use pelo menos 12 caracteres.');
  const cores=['var(--v5)','var(--v1)','var(--v2)','var(--v3)','var(--v4)'];contas.push({id:'u'+Date.now(),nome:n,l:n[0].toUpperCase(),cor:cores[(contas.length-5)%5],email:m,papel:'vendedor',bloq:false,sess:false,ip:'203.0.113.99',ap:'—',ent:0,ult:0,ultLogin:0});fecharModal();toast('Conta criada.');pintar();}
function csvUso(){const lin=[['dia','vendedor','primeira_entrada','ultima_atividade','ip','aparelho','logins','minutos_ativos','abertos','pegos','status_marcados','visitas','visitas_comprovadas']];Object.keys(uso).sort().forEach(k=>Object.entries(uso[k]).forEach(([id,u])=>lin.push([k,conta(id).nome,fmtHora(u.ent),fmtHora(u.ult),u.ip,u.ap,u.logins,u.min,u.abertos,u.pegos,u.marcados,u.visitas||0,u.comprovadas||0])));return lin.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');}
function baixarCsv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csvUso()],{type:'text/csv;charset=utf-8'}));a.download='uso_radar.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

/* ========== chegada de lead (simulada) ========== */
let seqSim=900;
function ding(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.06;o.start();o.stop(a.currentTime+.2);}catch(e){}}
function simular(t){const tipo=t||['MUL','AF','PRO'][Math.floor(Math.random()*3)],l=novoLead(tipo,seqSim++,Date.now());leads.unshift(l);st.coleta=Date.now();if(st.som)ding();
  $('#camada-flash').innerHTML=`<button id="flash" class="${tipo}" onclick="st.vista='radar';$('#camada-flash').innerHTML='';pintar();abrir('${l.id}',true)"><b>NOVA ${TIPO[tipo].g}</b><span>${esc(l.nome)} · ${esc(l.cidade)}</span></button>`;
  clearTimeout(simular.t);simular.t=setTimeout(()=>{$('#camada-flash').innerHTML='';},7000);pintar();return l;}

/* ========== modal ========== */
function abrirModal(h,larga){$('#camada-modal').innerHTML=`<div id="modal" onclick="if(event.target===this)fecharModal()"><div class="cx-modal ${larga?'larga':''}" role="dialog" aria-modal="true"><button class="x-modal" aria-label="Fechar" onclick="fecharModal()">×</button>${h}</div></div>`;}
function fecharModal(){$('#camada-modal').innerHTML='';}

</script>
